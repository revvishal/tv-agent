name: tv-agent
on:
  schedule:
    - cron: "0 6 */15 * *"   # UTC; replace with the schedule from your crontab
  workflow_dispatch: {}        # lets you run it manually

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python -m src.main   # replace with the command your crontab runs
        env:
          # move your secrets to GitHub → Settings → Secrets
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          REQUEST_DELAY_SECONDS: ${{ secrets.REQUEST_DELAY_SECONDS }}
          PLAYWRIGHT_HEADED: ${{ secrets.PLAYWRIGHT_HEADED }}
          SCRAPER_DEBUG: ${{ secrets.SCRAPER_DEBUG }}